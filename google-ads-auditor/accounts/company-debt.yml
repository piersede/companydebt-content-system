# Company Debt Google Ads account configuration.
#
# Fields marked "REPLACE" below cannot be inferred and must be filled in with
# real values before the first audit run. validate-config.py will flag them.

account_name: Company Debt
customer_id: "4634275788"                      # 463-427-5788, dashes stripped for GAQL
login_customer_id: "6038137400"                # 603-813-7400, manager account "Company Debt (Claude)"

currency: GBP
timezone: Europe/London
business_model: lead_generation

# Conversion actions as named in Google Ads (Tools & Settings > Conversions),
# supplied 2026-07-17. [N] badges shown in the Ads UI were stripped — not
# part of the literal conversion_action.name. Call-duration thresholds (e.g.
# whether "GoogleAds Phone Calls" variants require 60s+) are not yet
# confirmed — treat call-based primary conversions as unverified-quality
# until checked in each action's own settings.
primary_conversion_actions:
  - "Guide Download (Website)"
  - "GoogleAds Form Submissions (Website)"
  - "Calls from Smart Campaign Ads"
  - "GoogleAds Phone Calls From Ads"
  - "GoogleAds Phone Calls"
  - "GoogleAds Phone Calls (different number format)"
  - "Smart campaign ad clicks to call"
  - "GoogleAds Chat"
  - "Conversation started"
  - "Local actions - Directions"
  - "Deals - Deals Stage becomes Closed Won (1)"
  - "Sales orders - Sales orders Status becomes Approved"
  - "Deals - Deals Stage becomes Qualified for Insolvency Route"
  - "Leads - Leads Lead Status becomes Pre Qualified (1)"

secondary_conversion_actions:
  - "Lead form - Submit (Google hosted)"
  - "www.companydebt.com - GA4 (web) form_submission"
  - "Smart campaign map clicks to call"
  - "www.companydebt.com - GA4 (web) Chat"
  - "Android installs (all other apps)"
  - "Smart campaign map directions"

ignore_as_success_metrics:
  - Page view
  - Scroll

targets:
  target_cpa: null                             # REPLACE — £ target cost per primary conversion, or null if unset
  minimum_roas: null                            # not applicable unless ecommerce/paid-value goals are running
  minimum_clicks_before_judgement: 12
  minimum_impressions_before_ad_judgement: 1000
  zero_conversion_spend_threshold: 75           # £ — below this, zero-conversion spend is not called "waste"
  low_conversion_volume_threshold: 5
  conversion_lag_days: 7                        # exclude/flag the latest N days when judging settled CPA

brand_terms:
  - company debt
  - companydebt

# Terms that must never be added as negatives even if performance looks weak —
# e.g. core commercial phrases the business exists to rank/bid on.
# DEFERRED: no native Google Ads list for this exists (checked Shared Library
# exclusion lists, Brand lists, Business data — nothing fits). Piers chose to
# wait until the MCP connection is live, so real campaign/ad group names can
# be pulled and proposed for his sign-off rather than guessed now.
protected_terms:
  - REPLACE_WITH_PROTECTED_TERMS               # e.g. "creditors voluntary liquidation", "company debt help"

# Topics genuinely outside Company Debt's business scope — used by
# negative-keyword-miner to identify clearly irrelevant search terms.
irrelevant_topics:
  - personal debt
  - personal bank account
  - consumer credit card
  - student loan
  - debt collector jobs
  - CIS/PAYE jobs terms unrelated to insolvency

comparison_periods:
  primary_days: 7
  previous_period: true
  context_days: 28
  long_term_days: 90

reporting:
  include_low_confidence_findings: true
  maximum_priority_actions: 10
  output_currency_symbol: "£"
