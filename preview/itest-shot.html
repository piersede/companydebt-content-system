<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Insolvency test — question 1 (screenshot source)</title>
<link rel="stylesheet" href="/theme/assets/css/insolvency-test.css">
<style>
  /* Screenshot harness only. Reproduces the real page's step-1 screen with the
     production stylesheet so the laptop mockup shows the actual test, not a
     drawing of it. Not shipped anywhere. */
  html, body { margin:0; background:#fff; font-family:Arial, sans-serif; overflow:hidden; }
  .cd-itest-main { padding:0; }
  /* Captured at 980x631 — the laptop mockup's screen aspect ratio — so the
     panel fills the screen and the capture drops in without distortion. */
  #shot { width:980px; height:631px; padding:26px 44px; background:#fff; overflow:hidden; }
  .cd-itest-progress-wrap { display:flex !important; }
  .cd-itest-step { display:block !important; }
</style>
</head>
<body class="page page-template-insolvency-test">
<main id="primary" class="site-main cd-itest-main" data-cd-form-id="46">
<div id="shot">
  <div class="cd-itest-progress-wrap cd-itest-show" id="cd-itest-progressWrap">
    <div class="cd-itest-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
      <div class="cd-itest-progress-fill" id="cd-itest-progressFill" style="width:20%"></div>
    </div>
    <div class="cd-itest-progress-label" id="cd-itest-progressLabel">Step 1 of 4</div>
  </div>

  <div class="cd-itest-panel">
    <section class="cd-itest-step cd-itest-step--active" id="cd-itest-step-cashflow">
      <h2 class="cd-itest-q">Can the company currently pay its bills when they fall due?</h2>
      <ul class="cd-itest-options" id="cd-itest-opts-cashflow">
        <li class="cd-itest-opt"><input type="radio" name="cd_cashflow" id="cd-cf-2" value="difficulty"><label for="cd-cf-2">Yes, but only with difficulty</label></li>
        <li class="cd-itest-opt"><input type="radio" name="cd_cashflow" id="cd-cf-3" value="late"><label for="cd-cf-3">Some payments are already late</label></li>
        <li class="cd-itest-opt"><input type="radio" name="cd_cashflow" id="cd-cf-4" value="cannot"><label for="cd-cf-4">No, it cannot pay everything</label></li>
        <li class="cd-itest-opt"><input type="radio" name="cd_cashflow" id="cd-cf-5" value="unsure"><label for="cd-cf-5">I&rsquo;m not sure</label></li>
      </ul>
    </section>
  </div>
</div>
</main>
</body>
</html>
